name: CI — Test + Lint

on:
  push:
    branches: [main, develop, "feature/*"]
  pull_request:
    branches: [main, develop]

jobs:
  backend-lint:
    name: Backend Lint + Type Check
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      
      - name: Install linting dependencies
        run: |
          cd backend
          pip install ruff black mypy pydantic
      
      - name: Run ruff
        run: cd backend && ruff check . --output-format=github
      
      - name: Run black check
        run: cd backend && black --check --diff .
      
      - name: Run mypy on core modules
        run: cd backend && mypy core/ --ignore-missing-imports
        continue-on-error: true

  backend-test:
    name: Backend Unit + Integration Tests
    runs-on: ubuntu-latest
    needs: backend-lint
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
      
      - name: Create test environment file
        run: |
          cd backend
          cat > .env << EOF
          ENVIRONMENT=test
          SECRET_KEY=test-secret-key-that-is-32-chars-long-abc
          JWT_SECRET_KEY=test-jwt-key-that-is-also-32-chars-lon
          DATABASE_URL=sqlite+aiosqlite:///:memory:
          GOOGLE_CLIENT_ID=test-client-id
          GOOGLE_CLIENT_SECRET=test-client-secret
          HF_TOKEN=
          TEMP_DIR=./temp
          LOG_DIR=./logs
          MODEL_CACHE_DIR=./model_cache
          EOF
          mkdir -p temp logs model_cache
      
      - name: Run unit tests
        run: |
          cd backend
          pytest -m "unit" --tb=short -q --cov=. --cov-report=xml
        env:
          PYTHONPATH: .
      
      - name: Run integration tests
        run: |
          cd backend
          pytest -m "integration" --tb=short -q
        env:
          PYTHONPATH: .
      
      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          file: backend/coverage.xml
          flags: backend
        continue-on-error: true

  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        run: cd frontend && npm ci
      
      - name: Run ESLint
        run: cd frontend && npm run lint
      
      - name: Check TypeScript (if applicable)
        run: cd frontend && npx tsc --noEmit || true

  frontend-build:
    name: Frontend Build Check
    runs-on: ubuntu-latest
    needs: frontend-lint
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        run: cd frontend && npm ci
      
      - name: Create env file
        run: |
          cd frontend
          echo "NEXT_PUBLIC_API_URL=http://localhost:8000" > .env.local
      
      - name: Build Next.js
        run: cd frontend && npm run build
        env:
          NODE_ENV: production
