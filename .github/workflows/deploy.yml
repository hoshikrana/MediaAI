name: CD - Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy-backend:
    name: Deploy Backend to Hugging Face Spaces
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Hugging Face CLI
        run: python -m pip install --upgrade "huggingface_hub[cli]"

      - name: Upload backend Space
        run: |
          hf upload "${{ secrets.HF_SPACE_ID }}" . \
            --type=space \
            --commit-message="Deploy backend from GitHub Actions" \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude ".env" \
            --exclude "frontend/*" \
            --exclude "venv/*" \
            --exclude "data/*" \
            --exclude "models/*" \
            --exclude "training/*" \
            --exclude "results/outputs/*.pth" \
            --exclude "medsight.db" \
            --exclude "*.pdf" \
            --exclude "*.doc"
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

      - name: Wait for deployment
        run: sleep 120

      - name: Health check
        run: |
          for i in {1..20}; do
            response=$(curl -s -o /dev/null -w "%{http_code}" \
              "${{ secrets.HF_SPACE_URL }}/api/v1/health")
            if [ "$response" = "200" ]; then
              echo "Backend healthy"
              exit 0
            fi
            echo "Attempt $i: status $response, retrying in 30s..."
            sleep 30
          done
          echo "Backend health check failed"
          exit 1

  deploy-frontend:
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    needs: deploy-backend
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy to Vercel
        run: |
          vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }} \
            --yes \
            --cwd=./frontend \
            -e NEXT_PUBLIC_API_URL=${{ secrets.HF_SPACE_URL }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
